<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  <title>CSLearning · Computer Science Learning</title>
  <style>
    :root {
      --ink: #172b3a;
      --muted: #718391;
      --line: #dce5e8;
      --paper: #f7f9f7;
      --white: #fff;
      --teal: #168c81;
      --math: #9a78d1;
      --repr: #e5a13b;
      --prog: #4f91cc;
      --sys: #4aa486;
      --shadow: 0 18px 55px rgba(29, 54, 69, .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; overflow:hidden; color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 4%, rgba(226,239,231,.8), transparent 36%),
        var(--paper);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .topbar {
      height: 72px; padding: 0 34px; display: flex; align-items: center; gap: 24px;
      background: rgba(255,255,255,.88); border-bottom: 1px solid #e7edef;
      position: relative; z-index: 2;
    }
    .brand { display:flex; align-items:center; gap:11px; min-width:238px; }
    .brand-name { font-weight:800; letter-spacing:.01em; font-size:19px; }
    .brand-sub { color:#91a0a7; font-size:10px; letter-spacing:.14em; margin-top:2px; }
    .top-links { display:flex; gap:23px; color:#778994; font-size:13px; }
    .top-link { border:0; padding:8px 0; background:transparent; color:#778994; font-size:13px; cursor:pointer; }
    .top-link.active { color:#167e75; font-weight:700; }
    .mobile-nav { display:none; }
    .top-spacer { flex:1; }
    .search {
      display:flex; align-items:center; gap:9px; width:260px; height:37px; padding:0 12px;
      border:1px solid #e0e8e9; border-radius:11px; background:#f9fbfa; color:#84939b;
    }
    .search input { border:0; outline:0; width:100%; background:transparent; font-size:12px; color:var(--ink); }
    .search kbd { white-space:nowrap; border:1px solid #e1e7e8; border-radius:5px; padding:1px 5px; font-size:10px; color:#9aa7ad; background:#fff; }
    .avatar {
      width:31px; height:31px; display:grid; place-items:center; border-radius:50%;
      background:#e5f0ec; color:#397568; font-size:12px; font-weight:750;
    }
    .page {
      max-width:1660px; height:calc(100vh - 72px); height:calc(100dvh - 72px);
      margin:auto; padding:12px 24px 14px; display:flex; flex-direction:column;
    }
    .intro-row { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin:0 2px 17px; }
    .eyebrow { color:#168c81; text-transform:uppercase; letter-spacing:.16em; font-size:10px; font-weight:800; }
    h1 { font-size:25px; letter-spacing:-.045em; margin:5px 0 5px; font-weight:790; }
    .subhead { margin:0; color:#72838c; font-size:12px; }
    .intro-stats { display:flex; gap:10px; align-items:center; padding-bottom:3px; }
    .stat-pill { border:1px solid #e2e9e8; background:#ffffff9c; border-radius:10px; padding:8px 11px; color:#71828c; font-size:11px; }
    .stat-pill b { color:#263e4b; font-size:13px; margin-right:3px; }
    .workspace {
      position:relative; flex:1; min-height:0; height:auto; max-height:none;
      display:flex; flex-direction:column; overflow:hidden; border:1px solid #e0e8e7; border-radius:20px; background:#fcfdfb;
      box-shadow:0 12px 38px rgba(35,66,72,.055);
    }
    .map-toolbar {
      position:relative; z-index:1; flex:0 0 auto; min-height:54px; padding:8px 14px;
      display:flex; align-items:center; gap:8px; border-bottom:1px solid #e2e9e7;
      background:rgba(255,255,255,.96); box-shadow:0 3px 9px rgba(37,65,65,.055);
    }
    .map-label { color:#778891; font-size:11px; margin-right:4px; white-space:nowrap; }
    .filter-strip { display:flex; align-items:center; gap:7px; min-width:0; flex:1; overflow-x:auto; scrollbar-width:none; }
    .filter-strip::-webkit-scrollbar { display:none; }
    .filter {
      display:flex; align-items:center; gap:6px; border:1px solid #e5ebea; background:#fff;
      border-radius:9px; padding:7px 10px; font-size:10px; color:#657781; cursor:pointer;
      transition:.15s;
    }
    .filter:hover,.filter.selected { border-color:#badbd3; background:#eff8f5; color:#237b70; }
    .dot { width:7px; height:7px; display:inline-block; border-radius:50%; background:var(--dot); }
    .toolbar-spacer { display:none; }
    .map-count { color:#96a3a8; font-size:10px; margin-right:4px; }
    .zoom-controls {
      display:flex; align-items:center; gap:5px; padding:4px 5px 4px 10px;
      border:1px solid #dfe8e6; border-radius:11px; background:#fff;
      box-shadow:0 2px 7px rgba(39,67,68,.08);
    }
    .icon-btn {
      width:31px; height:31px; border:1px solid #e4eae9; border-radius:9px; background:#fff;
      color:#6d818a; cursor:pointer; font-size:15px;
    }
    .icon-btn:hover { background:#f1f7f5; color:#147c72; }
    .mode-toggle { border:1px solid #cbded9; border-radius:9px; padding:8px 11px; background:#eff8f5; color:#24776f; font-size:10px; font-weight:750; white-space:nowrap; cursor:pointer; }
    .mode-toggle:hover,.mode-toggle.active { background:#168c81; border-color:#168c81; color:#fff; }
    .map-scroll {
      position:relative; flex:1; min-height:0; width:100%; height:auto; overflow:hidden;
      background-image:radial-gradient(#dce7e3 0.8px, transparent .8px);
      background-size:22px 22px; background-position:0 0;
    }
    svg { display:block; width:100%; height:100%; min-width:1000px; touch-action:none; cursor:grab; user-select:none; }
    svg.dragging { cursor:grabbing; }
    #graph-3d { display:none; width:100%; height:100%; min-width:0; outline:0; touch-action:none; cursor:grab; background:radial-gradient(ellipse at 50% 40%,#152b3d 0%,#091723 70%,#06111b 100%); }
    #graph-3d.dragging { cursor:grabbing; }
    .map-scroll.view-3d #graph { display:none; }
    .map-scroll.view-3d #graph-3d { display:block; }
    .graph-tooltip { display:none; position:absolute; z-index:2; max-width:230px; pointer-events:none; padding:9px 11px; border:1px solid #ffffff24; border-radius:10px; background:#102434ed; color:#edf7f4; box-shadow:0 8px 25px #00101e55; font-size:10px; line-height:1.6; transform:translate(12px,12px); }
    .graph-tooltip b { display:block; color:#fff; font-size:12px; margin-bottom:2px; }
    .node { cursor:pointer; }
    .cluster-bg { stroke-width:1; stroke-dasharray:4 6; }
    .cluster-title { font-size:13px; font-weight:760; letter-spacing:.04em; }
    .cluster-caption { font-size:9px; fill:#91a0a5; }
    .entry-arrow-label { font-size:10px; font-weight:800; fill:#ad7624; }
    .entry-arrow { filter:drop-shadow(0 1px 2px #d99a3655); }
    .mobile-cluster { display:none; }
    .mobile-map { min-width:0; }
    .mobile-map #clusters { display:none; }
    .mobile-map .mobile-cluster { display:block; }
    .mobile-map .node-title { font-size:10px; }
    .mobile-cluster rect { stroke-width:1; stroke-dasharray:4 6; }
    .mobile-cluster .cluster-title { font-size:13px; }
    .mobile-cluster .cluster-caption { font-size:9px; }
    .edge { fill:none; stroke:#c9d7d6; stroke-width:1.6; opacity:.78; marker-end:url(#arrow); transition:.2s; }
    .edge.soft { stroke-dasharray:4 5; opacity:.48; }
    .edge.active { stroke:#178f83; stroke-width:2.7; opacity:1; }
    .node { cursor:pointer; transition:opacity .18s, filter .18s, transform .18s; }
    .node rect { fill:#fff; stroke:#dfe8e7; stroke-width:1.3; rx:13; filter:url(#nodeShadow); }
    .node .node-title { font-size:12px; font-weight:700; fill:#22343a; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
    .node.pending .node-title { fill:#bf4d3c; }
    .node.pending rect { stroke:#e7c9c3; }
    .node .node-dot { r:3.5; }
    .node:hover rect { stroke:#8dc9bd; stroke-width:1.8; }
    .node.selected rect { stroke:#168c81; stroke-width:2.5; fill:#f2fbf8; }
    .node.entry-point rect { stroke:#d99a36; stroke-width:2.4; }
    .node.entry-point .node-dot { fill:#d99a36; }
    .node.prereq rect { stroke:#6e9fc8; stroke-width:2; }
    .node.extension rect { stroke:#d7a34d; stroke-width:2; }
    .node.dimmed { opacity:.16; }
    .node.hidden-by-filter { opacity:.12; }
    .legend {
      position:relative; display:flex; gap:14px; align-items:center;
      border:0; border-radius:0; background:transparent; padding:0;
      color:#667b82; font-size:10px; box-shadow:none;
    }
    .legend-top { flex:1; min-width:0; overflow-x:auto; gap:12px; white-space:nowrap; scrollbar-width:none; }
    .legend-top::-webkit-scrollbar { display:none; }
    .legend-item { display:flex; align-items:center; gap:5px; }
    .legend-dot { width:7px;height:7px;border-radius:50%;background:var(--c); }
    .legend-line { position:relative; width:22px;height:0;border-top:1.7px solid #819a97; }
    .legend-line::after { content:""; position:absolute; right:-1px; top:-4px; border-left:5px solid #819a97; border-top:3px solid transparent; border-bottom:3px solid transparent; }
    .legend-line.dashed { border-top-style:dashed; }
    .legend-line.dashed::after { border-left-color:#a9b9b6; }
    .map-hint {
      position:relative; flex:0 1 auto; color:#7f8f94; font-size:10px; white-space:nowrap;
      background:transparent; border:0; border-radius:0; padding:0;
    }
    .detail {
      position:absolute; z-index:3; top:62px; right:18px; bottom:18px; width:360px;
      display:flex; flex-direction:column; overflow:hidden; border:1px solid #e1eae7;
      border-radius:17px; background:rgba(255,255,255,.97); box-shadow:var(--shadow);
      backdrop-filter:blur(14px); transform:translateX(calc(100% + 25px)); opacity:0;
      transition:transform .25s ease,opacity .22s ease; pointer-events:none;
    }
    .detail.open { transform:translateX(0); opacity:1; pointer-events:auto; }
    .detail-top { position:relative; padding:20px 20px 16px; border-bottom:1px solid #edf1ef; }
    .detail-close { position:absolute; top:12px; right:14px; border:0; background:transparent; color:#91a0a5; font-size:21px; line-height:1; cursor:pointer; }
    .detail-cta { display:block; width:100%; margin-top:15px; padding:10px 6px; }
    .type-label { color:#16877e; font-size:9px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    .detail h2 { margin:6px 0 5px; font-size:20px; letter-spacing:-.035em; }
    .detail-en { color:#9aa7ac; font-size:10px; }
    .book-tag { margin-top:13px; display:inline-flex; gap:7px; align-items:center; color:#6b7f87; background:#f4f7f6; border-radius:7px; padding:6px 8px; font-size:10px; }
    .detail-body { overflow:auto; padding:17px 20px 22px; flex:1; }
    .detail-body p { margin:0 0 14px; color:#5f737d; font-size:11px; line-height:1.8; }
    .section-label { display:flex; align-items:center; gap:7px; margin:16px 0 8px; color:#89979c; font-size:9px; font-weight:800; letter-spacing:.08em; }
    .rel-list { display:flex; flex-wrap:wrap; gap:6px; }
    .rel-chip { border:1px solid #e4ebea; border-radius:7px; padding:6px 8px; background:#fff; color:#607680; font-size:10px; cursor:pointer; }
    .rel-chip:hover { border-color:#add4ca; background:#f3faf7; color:#167d73; }
    .rel-chip.pre { border-color:#d7e5ef; color:#527d9a; }
    .rel-chip.ext { border-color:#f0e2c8; color:#98743c; }
    .objective { margin-top:15px; padding:11px 12px; background:#f4f8f6; border-radius:10px; }
    .objective b { display:block; color:#4f6b70; font-size:10px; margin-bottom:5px; }
    .objective span { color:#768b8e; font-size:10px; line-height:1.6; }
    .action {
      border:1px solid #e0e9e7; border-radius:9px; padding:9px 5px; background:#fff; color:#61757e;
      font-size:10px; font-weight:650; cursor:pointer;
    }
    .action.primary { border-color:#178c81; color:#fff; background:#178c81; box-shadow:0 4px 10px #168c8129; }
    .action:hover { transform:translateY(-1px); }
    .toast {
      position:absolute; z-index:4; left:50%; bottom:18px; transform:translate(-50%,14px);
      opacity:0; pointer-events:none; border-radius:9px; background:#1c3843; color:#fff;
      padding:10px 14px; font-size:11px; box-shadow:var(--shadow); transition:.2s;
    }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    .study-view {
      display:none; flex:1; min-height:0; overflow:auto; border:1px solid #e0e8e7;
      border-radius:20px; background:#fff; box-shadow:0 12px 38px rgba(35,66,72,.055);
    }
    .study-view.active { display:block; }
    .study-head {
      position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:14px;
      padding:13px 20px; border-bottom:1px solid #e7eeeb; background:#fffffff2; backdrop-filter:blur(12px);
    }
    .back-button { border:1px solid #e0e9e6; background:#fff; border-radius:9px; padding:8px 11px; color:#5e747c; font-size:11px; cursor:pointer; }
    .back-button:hover { border-color:#a8d0c5; color:#16877e; }
    .study-head-meta { color:#839399; font-size:10px; }
    .study-body { max-width:1000px; margin:0 auto; padding:30px 34px 60px; }
    .study-content { max-width:none; margin:0; padding:0; }
    .study-head-title { display:flex; align-items:baseline; gap:10px; min-width:0; color:#2c4a52; font-size:14px; font-weight:700; letter-spacing:-.01em; }
    .study-head-sub { max-width:min(58vw,640px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#89999e; font-size:10px; font-weight:400; letter-spacing:0; }
    .lab-group { border:1px solid #e5ece9; border-radius:12px; background:#fbfdfc; margin:10px 0; }
    .lab-group > summary { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; cursor:pointer; list-style:none; }
    .lab-group > summary::-webkit-details-marker { display:none; }
    .lab-group > summary span { color:#31505a; font-size:13px; font-weight:700; }
    .lab-group > summary small { color:#93a2a8; font-size:10px; }
    .lab-group > summary::after { content:"▾"; color:#9db0b4; font-size:11px; }
    .lab-group[open] > summary { border-bottom:1px solid #eef3f1; }
    .lab-group[open] > summary::after { content:"▴"; }
    .lab-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; padding:12px 14px 14px; }
    .lab-card { display:flex; flex-direction:column; gap:4px; text-align:left; border:1px solid #e3ebe8; border-radius:10px; background:#fff; padding:11px 12px; cursor:pointer; }
    .lab-card:hover { border-color:#a9d2c6; background:#f4faf7; }
    .lab-card[data-tool-group] { border-top-width:3px; transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease; }
    .lab-card[data-tool-group]:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(28,67,62,.08); }
    .lab-card[data-tool-group="logic"] { border-top-color:#8067b3; }
    .lab-card[data-tool-group="sets"] { border-top-color:#a875c9; }
    .lab-card[data-tool-group="numbers"] { border-top-color:#c58a48; }
    .lab-card[data-tool-group="algebra"] { border-top-color:#6b7fc4; }
    .lab-card[data-tool-group="calculus"] { border-top-color:#3f9e94; }
    .lab-card[data-tool-group="probability"] { border-top-color:#c06f93; }
    .lab-card[data-tool-group="combinatorics"] { border-top-color:#b08a45; }
    .lab-card[data-tool-group="graph"] { border-top-color:#3f86b8; }
    .lab-card[data-tool-group="repr"] { border-top-color:#3b7fc4; }
    .lab-card[data-tool-group="prog"] { border-top-color:#6d62c9; }
    .lab-card[data-tool-group="hardware"] { border-top-color:#c7842e; }
    .lab-card[data-tool-group="os"] { border-top-color:#d06b4e; }
    .lab-card[data-tool-group="network"] { border-top-color:#2b93a8; }
    .lab-card[data-tool-group="data"] { border-top-color:#3f8f73; }
    .lab-card[data-tool-group="ai"] { border-top-color:#b8528a; }
    .lab-card b { color:#2f4e56; font-size:12px; font-weight:650; }
    .lab-card small { color:#93a2a8; font-size:10px; }
    .lab-card svg { min-width:0; }
    .lab-card .lesson-fig { max-width:100%; overflow-x:auto; overflow-y:hidden; }
    .experiment-shell { display:grid; gap:12px; }
    .experiment-head { display:flex; flex-direction:column; gap:4px; }
    .experiment-badge { align-self:flex-start; padding:3px 7px; border-radius:999px; background:#eaf7f3; color:#16877e; font-size:9px; font-weight:800; letter-spacing:.12em; }
    .experiment-head b { color:#2c4a52; font-size:16px; letter-spacing:-.01em; }
    .experiment-head p { margin:0; color:#62787f; font-size:12px; line-height:1.8; }
    .exp-visual { border:1px solid #e5ece9; border-radius:12px; background:#fbfdfc; padding:6px; }
    .exp-graph { display:block; width:100%; height:auto; }
    .exp-question { color:#31515a; font-size:13px; font-weight:700; line-height:1.8; }
    .exp-choices { display:flex; flex-wrap:wrap; gap:8px; }
    .exp-feedback { min-height:22px; color:#52716d; font-size:12px; line-height:1.8; }
    .exp-state { color:#839399; font-size:10px; }
    .exp-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .exp-chip { padding:4px 8px; border-radius:999px; background:#f2f8f5; border:1px solid #e0ece7; color:#5c7b75; font-size:10px; }

<body>

          </defs>

  <script type="module">
    import { KnowledgeGraph3D } from "./src/graph3d.js";
    import { TOOLS, TOOL_BY_ID, TOOL_CATEGORIES, mountTool } from "./src/tools.js";
    import { EXPERIMENTS, EXPERIMENT_BY_ID, NODE_EXPERIMENT, mountExperiment } from "./src/experiments.js";
    import katex from "./vendor/katex/katex.js";
    const catalog = await fetch("./data/catalog.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("无法载入知识图谱数据");return r.json();});
    const {nodes,groupMeta,lessonLibrary,lessonNotes,exerciseBank}=catalog;
    const edges = [];
    const hardEdgeKeys=new Set(),softPairs=new Set();
    for (const n of nodes) for (const p of n.pre) {
      const key=`${p}->${n.id}`;hardEdgeKeys.add(key);edges.push({from:p,to:n.id,kind:"required"});
    }
    for (const n of nodes) for (const target of n.ext) {
      const key=`${n.id}->${target}`,pair=[n.id,target].sort().join("|");
      if(hardEdgeKeys.has(key)||hardEdgeKeys.has(`${target}->${n.id}`)||softPairs.has(pair))continue;
      softPairs.add(pair);edges.push({from:n.id,to:target,kind:"related"});
    }
    const color=Object.fromEntries(Object.entries(groupMeta).map(([k,v])=>[k,v.color]));
    const label=Object.fromEntries(Object.entries(groupMeta).map(([k,v])=>[k,v.label]));
    document.getElementById("map-legend").innerHTML=
      '<span class="legend-item"><i class="legend-dot" style="--c:#314956"></i>已完成</span>'+
      '<span class="legend-item"><i class="legend-dot" style="--c:#bf4d3c"></i>待补</span>'+
      '<span class="legend-item"><i class="legend-line"></i>必需前置</span>'+
      '<span class="legend-item"><i class="legend-line dashed"></i>扩展关联</span>';
    const nodeById = Object.fromEntries(nodes.map(n=>[n.id,n]));
    const svg = document.getElementById("graph");
    const graph3dCanvas=document.getElementById("graph-3d");
    const mapContent = document.getElementById("map-content");
    const mapScroll = document.getElementById("map-scroll");
    const clusterLayer = document.getElementById("clusters");
    const edgeLayer = document.getElementById("edges");
    const nodeLayer = document.getElementById("nodes");
    const entryMarkerLayer=document.getElementById("entry-marker");
    const mobileClusterLayer = document.getElementById("mobile-clusters");
    const modeToggle=document.getElementById("mode-toggle");
    const NS = "http://www.w3.org/2000/svg";
    let selected = null, filter = "all", activeTab = "intro", zoom = 1, panX = 0, panY = 0;
    let gesture = null, mobileLayout = null, mobileViewHeight = 0, graph3D=null, is3D=false, toolReturnLesson=null, toolReturnAnchor=null;
    const VIEW_STATE_KEY="cslearning.graph-view.v3";
    let viewSaveTimer=0;
    function make(tag,attrs={}) { const el=document.createElementNS(NS,tag); for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v); return el; }
    function applyTransform(){mapContent.setAttribute("transform",`translate(${panX} ${panY}) scale(${zoom})`);}
    function setDefaultMapView(){
      zoom=mobileLayout?1:1.5;panX=0;panY=0;applyTransform();
      mapScroll.scrollLeft=0;mapScroll.scrollTop=0;
    }
    function extensionIds(id){
      const node=nodeById[id];
      if(!node)return [];
      const children=nodes.filter(other=>other.pre.includes(id)).map(other=>other.id);
      return [...new Set([...(node.ext??[]),...children])].filter(target=>target!==id&&nodeById[target]);
    }
    function calculateRanks(){
      const ranks={};
      function rank(id,visiting=new Set()){
        if(ranks[id]!==undefined)return ranks[id];
        if(visiting.has(id))return 0;
        visiting.add(id);
        const n=nodeById[id];
        const value=n.pre.reduce((m,p)=>nodeById[p]?Math.max(m,rank(p,visiting)+1):m,0);
        visiting.delete(id);ranks[id]=value;return value;
      }
      for(const n of nodes)rank(n.id);
      return ranks;
    }
    function saveViewState(){
      const vb=svg.viewBox.baseVal;
      const state={
        version:3,mode:is3D?"3d":"2d",selected,
        panXRatio:panX/Math.max(1,vb.width),panYRatio:panY/Math.max(1,vb.height),zoom,
        camera:is3D?graph3D?.getViewState():null
      };
      try{localStorage.setItem(VIEW_STATE_KEY,JSON.stringify(state));}catch{}
    }
    function scheduleSaveView(){
      clearTimeout(viewSaveTimer);
      viewSaveTimer=window.setTimeout(saveViewState,140);
    }
    function restoreViewState(){
      let state;
      try{state=JSON.parse(localStorage.getItem(VIEW_STATE_KEY)||"null");}catch{return;}
      if(!state||state.version!==3)return;
      if(state.mode==="3d"&&!mobileLayout){
        is3D=true;mapScroll.classList.add("view-3d");ensure3D();
        graph3D.restoreViewState(state.camera);
        modeToggle.textContent="返回 2D";modeToggle.classList.add("active");modeToggle.setAttribute("aria-pressed","true");
        document.querySelector(".map-hint").textContent="点击画布启用 WASD · Q/E 升降 · 拖动旋转 · 滚轮缩放";
      }else{
        is3D=false;mapScroll.classList.remove("view-3d");
        const vb=svg.viewBox.baseVal;
        zoom=Math.max(.65,Math.min(1.65,Number(state.zoom)||1));
        panX=(Number(state.panXRatio)||0)*vb.width;panY=(Number(state.panYRatio)||0)*vb.height;applyTransform();
      }
      if(state.selected&&nodeById[state.selected])selectNode(state.selected);
      scheduleSaveView();
    }
    function update3DData(){
      if(!graph3D)return;
      const vb=svg.viewBox.baseVal;
      graph3D.updateData({nodes,edges,groupMeta,ranks:calculateRanks(),layoutWidth:vb.width,layoutHeight:vb.height});
      if(selected){const n=nodeById[selected];graph3D.setSelection(selected,n.pre,extensionIds(selected));}
    }
    function ensure3D(){
      const vb=svg.viewBox.baseVal;
      if(!graph3D)graph3D=new KnowledgeGraph3D(graph3dCanvas,mapScroll,{
        nodes,edges,groupMeta,ranks:calculateRanks(),layoutWidth:vb.width,layoutHeight:vb.height,
        onSelect:(id)=>selectNode(id),onViewChange:scheduleSaveView
      });
      else update3DData();
    }
    modeToggle.addEventListener("click",()=>{
      if(!is3D){
        is3D=true;mapScroll.classList.add("view-3d");mapScroll.scrollTop=0;
        ensure3D();graph3D.enter3D();modeToggle.textContent="返回 2D";modeToggle.classList.add("active");
        modeToggle.setAttribute("aria-pressed","true");
        document.querySelector(".map-hint").textContent="点击画布启用 WASD · Q/E 升降 · 拖动旋转 · 滚轮缩放";
        scheduleSaveView();
      }else{
        modeToggle.disabled=true;
        graph3D.exit3D(()=>{
          is3D=false;mapScroll.classList.remove("view-3d");modeToggle.textContent="进入 3D";
          modeToggle.classList.remove("active");modeToggle.setAttribute("aria-pressed","false");modeToggle.disabled=false;
          document.querySelector(".map-hint").textContent="拖动空白处平移 · 滚轮缩放 · 点击知识点查看";
          scheduleSaveView();
        });
      }
    });
    function sortedGroup(group,ranks){
      return nodes.filter(n=>n.group===group).sort((a,b)=>ranks[a.id]-ranks[b.id]||a.title.localeCompare(b.title,"zh-CN"));
    }

    function drawEdges() {
      edgeLayer.replaceChildren();
      for (const e of edges) {
        const a=nodeById[e.from], b=nodeById[e.to]; if(!a||!b) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        let sx,sy,tx,ty,c1x,c1y,c2x,c2y;
        if(Math.abs(dx)>Math.abs(dy)) {
          const dir=Math.sign(dx)||1;
          sx=a.x+dir*65; sy=a.y+24; tx=b.x-dir*65; ty=b.y+24;
          c1x=sx+dir*Math.max(25,Math.abs(dx)*.32); c1y=sy;
          c2x=tx-dir*Math.max(25,Math.abs(dx)*.32); c2y=ty;
        } else {
          const dir=Math.sign(dy)||1;
          sx=a.x; sy=a.y+24+dir*24; tx=b.x; ty=b.y+24-dir*24;
          c1x=sx; c1y=sy+dir*Math.max(20,Math.abs(dy)*.27);
          c2x=tx; c2y=ty-dir*Math.max(20,Math.abs(dy)*.27);
        }
        const path=make("path",{d:`M ${sx} ${sy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty}`,class:`edge ${e.kind==="related"?"soft":""}`,"data-from":e.from,"data-to":e.to});
        edgeLayer.append(path);

    function applyMath(root){
      if(!root) return;
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const targets=[];
      while(walker.nextNode()){const t=walker.currentNode;if(t.nodeValue&&t.nodeValue.includes("$"))targets.push(t);}
      for(const node of targets){
        const text=node.nodeValue;
        const html=text.replace(/\$\$([^$]+)\$\$|\$([^$]+)\$/g,(whole,display,inline)=>{
          const expr=(display??inline).trim();
          try{return katex.renderToString(expr,{throwOnError:false,displayMode:!!display,strict:false});}
          catch{return whole;}
        });
        if(html!==text){
          const span=document.createElement("span");
          span.innerHTML=html;
          node.replaceWith(span);
        }
      }
    }

        const choices=q.choices||q.options.map(text=>({value:text,text}));
        return `<div class="practice-card"><h2 class="practice-prompt">${index+1}. ${escapeHTML(q.prompt)}</h2>
          ${choices.map((o,i)=>`<label class="answer-option"><input type="${q.multi?"checkbox":"radio"}" name="practice-answer-${index}" value="${escapeHTML(o.value)}"><span>${String.fromCharCode(65+i)}. ${escapeHTML(o.text)}</span></label>`).join("")}
          <div class="study-cta"><button class="study-button primary" data-check-answer="${index}">检查答案</button><button class="study-button" data-show-answer="${index}">查看解析</button></div>
          <div class="practice-feedback" id="practice-feedback-${index}" aria-live="polite"></div></div>`;
      }).join("");
    }
    function bindPractice(container,n){
      practiceQuestions(n).forEach((q,index)=>{
        const feedback=container.querySelector(`#practice-feedback-${index}`);
        if(!feedback)return;
        if(q.type==="written"){
          const button=container.querySelector(`[data-toggle-answer="${index}"]`);
          button.addEventListener("click",()=>{
            const open=feedback.hidden;
            feedback.hidden=!open;
            if(open)applyMath(feedback);
            button.textContent=open?"隐藏答案":"查看答案";
            button.setAttribute("aria-expanded",String(open));
          });
          return;
        }
        const choices=q.choices||q.options.map(text=>({value:text,text}));
        container.querySelector(`[data-check-answer="${index}"]`).addEventListener("click",()=>{
          const selected=[...container.querySelectorAll(`input[name="practice-answer-${index}"]:checked`)].map(x=>x.value).sort();
          const answer=[...q.answer].sort(),correct=selected.length===answer.length&&selected.every((v,i)=>v===answer[i]);
          feedback.style.color=correct?"#16806f":"#b06a43";
          feedback.textContent=correct?`回答正确。${q.explanation}`:`还不完全正确，再想一想。${q.multi?"请同时选出所有正确项。":"可以参考答案。"}`;
        });
        container.querySelector(`[data-show-answer="${index}"]`).addEventListener("click",()=>{
          feedback.style.color="#60767d";
          feedback.textContent=`参考答案：${q.answer.map(x=>choices.find(c=>c.value===x)?.text||x).join("、")}。${q.explanation}`;
        });
      });
    }
    function renderLabsPage(){
      const categories=[...TOOL_CATEGORIES, ...new Set(TOOLS.map(tool=>tool.category).filter(category=>!TOOL_CATEGORIES.includes(category)))];
      const groups=categories.map(category=>({category,tools:TOOLS.filter(tool=>tool.category===category)})).filter(group=>group.tools.length);
      const sections=groups.map(group=>`<details class="lab-group" open>
        <summary><span>${escapeHTML(group.category)}</span><small>${group.tools.length} 个工具</small></summary>
        <div class="lab-grid">${group.tools.map(tool=>`<button class="lab-card" data-open-tool="${tool.id}" data-tool-group="${tool.group}">
          <b>${escapeHTML(tool.title)}</b><small>${escapeHTML(tool.summary)}</small>
          ${tool.nodes.length>1?`<small>关联 ${tool.nodes.length} 个知识点</small>`:""}</button>`).join("")}</div></details>`).join("");
      openOverview("工具",`${TOOLS.length} 个工具 · ${groups.length} 个类目`,
        `<div class="study-kicker">TOOLS · 自由探索</div>
        <h1 class="study-title">工具</h1>
        <p class="study-lead">工具按功能类目组织，不绑定单个知识点。打开后可以自由改条件、试极端值，观察会出现什么意外结果。教材里的实验会在旁边给出相关工具入口。</p>${sections}`);
      studyContent.querySelectorAll("[data-open-tool]").forEach(button=>{
        button.addEventListener("click",()=>openLab(button.dataset.openTool));
      });
    }
    function openLab(toolId,returnLessonId=null,returnAnchor=null){
      const tool=TOOL_BY_ID[toolId];
      if(!tool)return;
      toolReturnLesson=returnLessonId;
      toolReturnAnchor=returnAnchor;
      document.getElementById("study-back").textContent=returnLessonId?"← 返回知识点":"← 知识图谱";
      if(is3D)graph3D?.pause();
      setStudyTitle(tool.title,tool.summary);
      detail.classList.remove("open");workspace.style.display="none";studyView.classList.add("active");
      studyContent.innerHTML=`<div class="lab-card tool-page-card" id="lab-single"></div>`;
      mountTool(toolId,studyContent.querySelector("#lab-single"),{applyMath,standalone:true});
      applyMath(studyContent);
      studyView.scrollTop=0;
      scheduleSaveView();
    }
    function chip(id,type) {
      const n=nodeById[id]; if(!n)return "";
      return `<button class="rel-chip ${type}" data-jump="${id}">${n.title} ↗</button>`;
    }
    function renderTab() {
      if(!selected)return;
      const n=nodeById[selected];
      body.innerHTML=`<p>${n.summary}</p>
        <div class="section-label">前置知识 · ${n.pre.length}</div>
        <div class="rel-list">${n.pre.length?n.pre.map(id=>chip(id,"pre")).join(""):'<span style="color:#98a5a9;font-size:10px">图谱入口暂无必需前置</span>'}</div>
        <div class="section-label">扩展知识 · ${extensionIds(n.id).length}</div>
        <div class="rel-list">${extensionIds(n.id).length?extensionIds(n.id).map(id=>chip(id,"ext")).join(""):'<span style="color:#98a5a9;font-size:10px">后续知识点正在规划</span>'}</div>
        <div class="objective"><b>学完你将能够</b><span>${n.goal}</span></div>`;
      body.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>selectNode(b.dataset.jump)));
      applyMath(body);
    }
    function selectNode(id) {
      selected=id; activeTab="intro"; const n=nodeById[id];
      document.getElementById("detail-domain").textContent=label[n.group];
      document.getElementById("detail-title").textContent=n.title;
      document.getElementById("detail-id").textContent=n.en+"  ·  "+n.id;
      document.getElementById("detail-book").textContent=n.book;
      detail.classList.add("open"); renderTab(); applyVisualState();scheduleSaveView();
    }
    document.getElementById("close-detail").addEventListener("click",()=>{detail.classList.remove("open");selected=null;applyVisualState();scheduleSaveView();});
    document.querySelectorAll(".action").forEach(b=>b.addEventListener("click",()=>openStudy(b.dataset.action,selected)));
    function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2200);}
    document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{
      filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("selected",x===b));
      const count=nodes.filter(n=>filter==="all"||n.group===filter).length;
      document.getElementById("map-count").textContent=filter==="all"?`显示全部 · ${nodes.length} 个`:`当前知识域 · ${count} 个`;
      applyVisualState();
    }));
    const search=document.getElementById("search");
    search.addEventListener("input",()=>{
      const q=search.value.trim().toLowerCase();
      document.querySelectorAll(".node").forEach(el=>{
        const n=nodeById[el.dataset.id];const match=!q||n.title.toLowerCase().includes(q)||n.en.toLowerCase().includes(q)||n.id.includes(q);
        el.classList.toggle("dimmed",!match);
      });
      graph3D?.setSearch(q);
      if(q){const exact=nodes.find(n=>n.title.toLowerCase()===q||n.en.toLowerCase()===q||n.id===q);if(exact)document.getElementById("map-count").textContent=`找到：${exact.title}`;}
      else document.getElementById("map-count").textContent=filter==="all"?`显示全部 · ${nodes.length} 个`:"当前知识域";
    });
    window.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==search){e.preventDefault();search.focus();}if(e.key==="Escape"){detail.classList.remove("open");selected=null;applyVisualState();}});
    function setZoom(z,focus=null){
      if(!focus){const vb=svg.viewBox.baseVal;focus={x:vb.x+vb.width/2,y:vb.y+vb.height/2};}
      const next=Math.min(1.65,Math.max(.65,z));
      panX=focus.x-((focus.x-panX)/zoom)*next;
      panY=focus.y-((focus.y-panY)/zoom)*next;
      zoom=next;applyTransform();scheduleSaveView();
    }
    svg.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.08:.92),svgPoint(e));},{passive:false});
    document.getElementById("zoom-in").addEventListener("click",()=>is3D?graph3D?.zoomBy(.88):setZoom(zoom+.1));
    document.getElementById("zoom-out").addEventListener("click",()=>is3D?graph3D?.zoomBy(1.14):setZoom(zoom-.1));
    document.getElementById("reset").addEventListener("click",()=>{
      if(is3D)graph3D?.resetView();else{applyResponsiveLayout(true);setDefaultMapView();}
      search.value="";graph3D?.setSearch("");filter="all";document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("selected",x.dataset.filter==="all"));
      document.getElementById("map-count").textContent=`显示全部 · ${nodes.length} 个`;selected=null;detail.classList.remove("open");applyVisualState();
      scheduleSaveView();
    });
    document.getElementById("map-count").textContent=`显示全部 · ${nodes.length} 个`;
    applyResponsiveLayout(true);
    setDefaultMapView();
    restoreViewState();
    window.addEventListener("resize",()=>{applyResponsiveLayout();if(graph3D)update3DData();scheduleSaveView();});
    window.addEventListener("beforeunload",saveViewState);
  </script>
</body>
</html>
